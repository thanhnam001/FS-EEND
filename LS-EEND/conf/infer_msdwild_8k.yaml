# Inference config for batch_infer_kaldi.py on MSDWild (8 kHz -- see
# finetune_msdwild_8k.yaml for why 8 kHz is mandatory).
#
# chunk_size here only sets model.params.max_seqlen (via the !ref below); the
# batch driver feeds each recording whole, so it must cover the LONGEST test
# file. MSDWild test maxes at 1320 s = 132,000 raw frames at 10 ms, hence
# 140000. Their own long-file configs (dihard3/ami) use 100000 = 1000 s, which
# is NOT enough for MSDWild.
#
# Scoring: dscore --collar 0.25, and pass --median 11
log:
  model_name: infer_msdwild_8k
  log_dir: !ref ./logs/<log[model_name]>
  save_top_k: -1
  start_epoch: 416
  end_epoch: 420
  save_avg_path: 

training:
  batch_size: 1
  n_workers: 8
  shuffle: True
  lr: 1.0e-05
  opt: adam                   # [adam, sgd, noam]
  max_epochs: 100
  grad_clip: 5
  grad_accm: 1
  scheduler:
  schedule_scale:  # 0.4 # 1.0
  warm_steps:  # 20000 # 100000
  early_stop_epoch: 100
  init_ckpt:  # ckpt path for model initiliazation
  dist_strategy: # ddp       # [ddp, dp]
  sync_batchnorm: True
  val_interval: 1             # validation after ? epoch(s) of training
  seed: 777


model:
  arch: onlineConformerDA_retention_emb1dcnn_linear_nonautoreg_l2norm
  params:
    n_units: 256
    n_heads: 4
    enc_n_layers: 4
    feed_forward_expansion_factor: 4
    # dec_dim_feedforward: 2048
    conv_expansion_factor: 2
    dropout: 0.1
    conv_kernel_size: 16
    half_step_residual: True
    max_seqlen: !ref <data[chunk_size]>
    recurrent_chunk_size: 500
    dec_n_layers: 2
    conv_delay: 9

data:
  num_speakers:
  max_speakers: 10
  context_recp: 7
  label_delay: 0  # number of frames delayed from original labels for uni-directional rnn to see in the future
  feat_type: logmel23_cummn # ['', 'log', 'logmel', 'logmel23', 'logmel23_mn', 'logmel23_mvn', 'logmel23_swn']
  chunk_size: 13500   # 1350 s; longest MSDWild test file is 1320.5 s (0.1 s units)
  chunk_step: 10000
  val_chunk_size: 140000
  val_chunk_step: 140000
  subsampling: 10
  use_last_samples: True
  shuffle: False
  augment:
  feat:
    sample_rate: 8000
    win_length: 200
    n_fft: 1024
    hop_length: 80
    n_mels: 23
    f_max: 4000
    power: 1
  scaler:
    statistic: instance # instance or dataset-wide statistic
    normtype: minmax # minmax or standard or mean normalization
    dims: [1, 2] # dimensions over which normalization is applied

  train_data_dir: "" # unused: batch_infer_kaldi.py reads --kaldi_dir, not this
  val_data_dir: "" # unused: batch_infer_kaldi.py reads --kaldi_dir, not this

task:
  max_speakers: 
  spk_attractor:
    enable: True
    shuffle: True
    enc_dropout: 0.5
    dec_dropout: 0.5
    consis_weight: 1  # 0 for not using  

# Used for debugging, how many data would be used in this run
debug:                
  num_sanity_val_steps: 3         # Validation steps before training
  log_every_n_steps: 5          # Frequency of updating logs
  # flush_logs_every_n_steps: 1     # Frequency of flushing logs
  # limit_train_batches: 0.1      # How many train data to be used (0-1)
  # limit_val_batches: 0.1          # How many val data to be used 
  # limit_test_batches: 0.1       # How many test data to be used 





