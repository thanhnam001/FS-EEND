# LS-EEND progressive finetune on RAMC -- STAGE TEMPLATE.
#
# Derived from the authors' AMI config, NOT their dihard3 one. The paper's
# rule (Sec. IV-C) is: "Audio length is increased from 200 s until it
# approximates the average recording duration of each dataset", and RAMC's
# average recording is 31.1 min (measured) against AMI's 35.6 min. So RAMC
# takes AMI's schedule -- 200 -> 400 -> 800 -> 1600 s -- not DIHARD3's single
# 400 s step. Fig. 3 of the paper shows skipping steps costs real DER
# (400s->1600s "has a prominent performance decrease").
#
# chunk_size is in SUBSAMPLED frames: hop 80 @ 8 kHz = 10 ms, subsampling 10,
# so one unit is 0.1 s and chunk_size 2000 = 200 s. (This is what makes their
# callhome 2000 / dihard3 4000 line up with the paper's 200 s / 400 s.)
#
# scripts/run_finetune_ramc_progressive.sh rewrites per stage:
#   chunk_size, chunk_step, init_ckpt, model_name, batch_size
# so this file holds the stage-1 (200 s) values. Do not run it directly.
#
# max_speakers 3: RAMC has exactly 2 real speakers in every recording plus
# G00000000 in 286/289 training files, and we train on the same labels our
# own DiaPer systems do, so the label space is 3. The paper sets S to the
# maximum number appearing in the training set. Scoring still excludes
# G00000000 -- that is a scoring convention, not a training one.
#
# BUDGET: their AMI values, 10 epochs per stage = 40 total. That is ~12x
# cheaper than the 500 this file used to carry (inherited from dihard3), and
# it is what the authors actually ran for an AMI-sized corpus.
#
# SCORING CONVENTION for this corpus: collar 0, NO median filtering (median 1)
#
# Run: ./scripts/run_finetune_ramc_progressive.sh
log:
  model_name: finetune_ramc_8k_s1_200s
  log_dir: !ref ./logs/<log[model_name]>
  save_top_k: -1
  start_epoch: 90
  end_epoch: 99
  save_avg_path: # !ref /mnt/home/liangdi/projects/pl_version/pl_eend/logs/spk_onl_tfm_enc_dec_10w/version_7/<model[arch]>_2spk_90_100_avg_model.ckpt

training:
  batch_size: 8
  n_workers: 8
  shuffle: True
  lr: 1.0e-05
  opt: adam                   # [adam, sgd, noam]
  max_epochs: 10
  grad_clip: 5
  grad_accm: 1
  scheduler:
  schedule_scale:  # 0.4 # 1.0
  warm_steps:  # 20000 # 100000
  early_stop_epoch: 500
  init_ckpt: ./ckpt/simu/simu_1-8spk.ckpt
  dist_strategy: # ddp       # [ddp, dp]
  sync_batchnorm: True
  val_interval: 1             # validation after ? epoch(s) of training
  seed: 777


model:
  arch: onlineConformerDA_cummn_retention_emb1dcnn_linear_nonautoreg_l2norm_pit
  params:
    n_units: 256
    n_heads: 4
    enc_n_layers: 4
    feed_forward_expansion_factor: 4
    # dec_dim_feedforward: 2048
    conv_expansion_factor: 2
    dropout: 0.1
    conv_kernel_size: 16
    half_step_residual: True
    max_seqlen: !ref <data[chunk_size]>
    recurrent_chunk_size: 500
    dec_n_layers: 2
    conv_delay: 9
  
data:
  num_speakers:
  max_speakers: 3
  context_recp: 7
  label_delay: 0  # number of frames delayed from original labels for uni-directional rnn to see in the future
  feat_type: logmel23_cummn # ['', 'log', 'logmel', 'logmel23', 'logmel23_mn', 'logmel23_mvn', 'logmel23_swn']
  chunk_size: 2000
  chunk_step: 2000
  val_chunk_size: 100000
  val_chunk_step: 100000
  subsampling: 10
  use_last_samples: True
  shuffle: False
  augment:
  feat:
    sample_rate: 8000
    win_length: 200
    n_fft: 1024
    hop_length: 80
    n_mels: 23
    f_max: 4000
    power: 1
  scaler:
    statistic: instance # instance or dataset-wide statistic
    normtype: minmax # minmax or standard or mean normalization
    dims: [1, 2] # dimensions over which normalization is applied

  train_data_dir: /data/ocr/namvt17/dataset/diarization/ramc/kaldi_8k/train
  val_data_dir: /data/ocr/namvt17/dataset/diarization/ramc/kaldi_8k/dev

task:
  max_speakers: 
  spk_attractor:
    enable: True
    shuffle: True
    enc_dropout: 0.5
    dec_dropout: 0.5
    consis_weight: 1  # 0 for not using  

# Used for debugging, how many data would be used in this run
debug:                
  num_sanity_val_steps: 3         # Validation steps before training
  log_every_n_steps: 5          # Frequency of updating logs
  # flush_logs_every_n_steps: 1     # Frequency of flushing logs
  # limit_train_batches: 0.1      # How many train data to be used (0-1)
  # limit_val_batches: 0.1          # How many val data to be used 
  # limit_test_batches: 0.1       # How many test data to be used 





